
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vancouver 2026 🍁</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --green:#1a4731;--green-light:#2d6a4f;--green-pale:#f0f7f4;
  --white:#fff;--bg:#f8f7f4;--border:#e5e7eb;
  --text:#1a1a1a;--text-muted:#6b7280;
  --radius:12px;--shadow:0 2px 10px rgba(0,0,0,0.07);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

.hero{background:linear-gradient(135deg,#1a4731 0%,#2d6a4f 100%);padding:40px 20px 32px;text-align:center;}
.hero-title{font-size:clamp(26px,5vw,44px);font-weight:800;color:white;margin-bottom:6px;}
.hero-sub{color:rgba(255,255,255,0.75);font-size:15px;margin-bottom:20px;}
.hero-stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.hero-stat{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);border-radius:10px;padding:10px 18px;color:white;text-align:center;}
.hero-stat .val{font-size:20px;font-weight:700;display:block;}
.hero-stat .lbl{font-size:11px;opacity:0.7;text-transform:uppercase;letter-spacing:.05em;}

.nav{background:white;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:var(--shadow);}
.nav-inner{display:flex;max-width:1100px;margin:0 auto;padding:0 20px;}
.nav-btn{flex:1;padding:14px 8px;border:none;background:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;}
.nav-btn.active{color:var(--green);border-bottom-color:var(--green);}

main{max-width:1100px;margin:0 auto;padding:20px 24px 80px;}
.tab{display:none;}.tab.active{display:block;}

.day-card{background:white;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);}
.day-header{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;}
.day-num{width:36px;height:36px;border-radius:10px;background:var(--green);color:white;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.day-info{flex:1;}
.day-title{font-weight:700;font-size:15px;}
.day-date{font-size:12px;color:var(--text-muted);}
.day-cost{font-size:13px;font-weight:600;color:var(--green-light);margin-right:8px;}
.day-chevron{font-size:11px;color:var(--text-muted);transition:transform .2s;}
.day-chevron.open{transform:rotate(180deg);}
.day-body{padding:0 16px 12px;border-top:1px solid var(--border);display:none;}
.day-empty{padding:12px 0;font-size:13px;color:var(--text-muted);font-style:italic;}

.act-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f3f4f6;}
.act-item:last-child{border-bottom:none;}
.act-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.act-info{flex:1;min-width:0;}
.act-name{font-size:14px;font-weight:600;}
.act-meta{font-size:11px;color:var(--text-muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;}
.act-cost{font-size:13px;font-weight:600;color:var(--green-light);flex-shrink:0;}
.act-chip{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:10px;}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:24px;}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;padding:6px 0;}
.cal-cell{min-height:90px;background:white;border:1px solid var(--border);border-radius:8px;padding:5px;cursor:default;transition:all .15s;}
.cal-cell.has-day{cursor:pointer;border-top:3px solid var(--green);}
.cal-cell.has-day:hover{box-shadow:var(--shadow);border-color:var(--green);}
.cal-cell.empty{background:transparent;border-color:transparent;}
.cal-date{font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:3px;}
.cal-cell.has-day .cal-date{color:var(--green);}
.cal-chip{font-size:9px;background:#f8f7f4;border-left:2px solid;border-radius:3px;padding:1px 4px;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.4;}
.cal-more{font-size:9px;color:var(--text-muted);padding:1px 2px;}
.cal-month-title{font-size:20px;font-weight:800;margin-bottom:12px;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal-overlay.hidden{display:none;}
.modal{background:white;border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:85vh;overflow-y:auto;padding:24px;}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px;}
.modal-date{font-size:13px;color:var(--text-muted);margin-bottom:4px;}
.modal-title{font-size:20px;font-weight:800;margin-bottom:16px;color:var(--green);}

.loading{text-align:center;padding:60px 20px;color:var(--text-muted);}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:600px){
  .cal-chip{display:none;}
  .cal-cell.has-day::after{content:'•';display:block;text-align:center;color:var(--green);font-size:16px;margin-top:4px;}
  main{padding:16px 12px 80px;}
}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-title">🍁 Vancouver 2026</div>
  <div class="hero-sub">Garcia-Morera Family Trip · June 15 – 30</div>
  <div class="hero-stats">
    <div class="hero-stat"><span class="val">16</span><span class="lbl">Days</span></div>
    <div class="hero-stat"><span class="val">12</span><span class="lbl">People</span></div>
    <div class="hero-stat"><span class="val" id="stat-activities">—</span><span class="lbl">Activities</span></div>
  </div>
</div>

<nav class="nav">
  <div class="nav-inner">
    <button class="nav-btn active" onclick="showTab('list',this)">📋 Itinerary</button>
    <button class="nav-btn" onclick="showTab('calendar',this)">📅 Calendar</button>
  </div>
</nav>

<main>
  <div id="tab-list" class="tab active">
    <div id="list-container"><div class="loading"><div class="spinner"></div>Loading your trip...</div></div>
  </div>
  <div id="tab-calendar" class="tab">
    <div id="cal-container"><div class="loading"><div class="spinner"></div>Loading calendar...</div></div>
  </div>
</main>

<div class="modal-overlay hidden" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://ajtjpcenmlzmpnzrfxvg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqdGpwY2VubWx6bXBuenJmeHZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2ODM5ODIsImV4cCI6MjA5MTI1OTk4Mn0.JoLMU5T6LJiCAQ_xLzEHmGI7CPACeeDMQjt_tfNSO5k';
const TRIP_ID = 'a1b2c3d4-0000-0000-0000-000000000001';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CAT_COLORS = {flight:'#c62828',accommodation:'#5e35b1',food:'#e76f00',activity:'#2d6a4f',transport:'#1565c0',other:'#6b7280',hotel:'#5e35b1'};
const CAT_LABELS = {flight:'Flight',accommodation:'Stay',food:'Food',activity:'Activity',transport:'Transport',other:'Misc',hotel:'Stay'};

var allDays = [], allItems = [];

function fmtDate(d){
  if(!d) return '';
  return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function fmtMoney(n){ return 'US$'+Math.round(Number(n)||0).toLocaleString(); }

function showTab(name, btn){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
}

async function loadData(){
  try {
    var r1 = await sb.from('itinerary_days').select('*').eq('trip_id',TRIP_ID).order('day_number');
    var r2 = await sb.from('itinerary_items').select('*').not('day_id','is',null).order('sort_order');
    allDays = r1.data || [];
    allItems = r2.data || [];
    document.getElementById('stat-activities').textContent = allItems.length;
    renderList();
    renderCalendar();
  } catch(e) {
    document.getElementById('list-container').innerHTML = '<div class="loading">Error loading data 😕</div>';
  }
}

function renderList(){
  var container = document.getElementById('list-container');
  container.innerHTML = '';
  if(!allDays.length){
    container.innerHTML = '<div class="loading">No days yet 📅</div>';
    return;
  }
  allDays.forEach(function(day){
    var items = allItems.filter(function(i){return i.day_id===day.id;})
      .sort(function(a,b){return (a.sort_order||0)-(b.sort_order||0);});
    var dayTotal = items.reduce(function(s,i){return s+(Number(i.cost)||0);},0);

    var card = document.createElement('div');
    card.className = 'day-card';

    var hdr = document.createElement('div');
    hdr.className = 'day-header';
    hdr.innerHTML =
      '<div class="day-num">'+day.day_number+'</div>'+
      '<div class="day-info">'+
        '<div class="day-title">'+(day.title||'Day '+day.day_number)+'</div>'+
        '<div class="day-date">'+fmtDate(day.date)+'</div>'+
      '</div>'+
      (dayTotal?'<div class="day-cost">'+fmtMoney(dayTotal)+'</div>':'')+
      '<div class="day-chevron" id="chev-'+day.id+'">▼</div>';

    var body = document.createElement('div');
    body.className = 'day-body';

    if(!items.length){
      body.innerHTML = '<div class="day-empty">Nothing planned yet</div>';
    } else {
      items.forEach(function(item){
        var a = document.createElement('div');
        a.className = 'act-item';
        a.innerHTML =
          '<div class="act-dot" style="background:'+(CAT_COLORS[item.category]||'#6b7280')+'"></div>'+
          '<div class="act-info">'+
            '<div class="act-name">'+item.activity+'</div>'+
            '<div class="act-meta">'+
              (item.time?'<span>⏰ '+item.time+'</span>':'')+
              (item.location?'<span>📍 '+item.location+'</span>':'')+
              '<span class="act-chip">'+(CAT_LABELS[item.category]||item.category||'')+'</span>'+
            '</div>'+
          '</div>'+
          (item.cost?'<div class="act-cost">'+fmtMoney(item.cost)+'</div>':'');
        body.appendChild(a);
      });
    }

    hdr.onclick = function(){
      var open = body.style.display === 'block';
      body.style.display = open ? 'none' : 'block';
      document.getElementById('chev-'+day.id).className = 'day-chevron'+(open?'':' open');
    };

    card.appendChild(hdr);
    card.appendChild(body);
    container.appendChild(card);
  });
}

function renderCalendar(){
  var container = document.getElementById('cal-container');
  container.innerHTML = '';

  var monthEl = document.createElement('div');
  var title = document.createElement('div');
  title.className = 'cal-month-title';
  title.textContent = 'June 2026';
  monthEl.appendChild(title);

  var grid = document.createElement('div');
  grid.className = 'cal-grid';

  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(function(d){
    var dow = document.createElement('div');
    dow.className = 'cal-dow';
    dow.textContent = d;
    grid.appendChild(dow);
  });

  var firstDay = new Date(2026,5,1).getDay();
  var daysInMonth = 30;

  for(var i=0;i<firstDay;i++){
    var empty = document.createElement('div');
    empty.className = 'cal-cell empty';
    grid.appendChild(empty);
  }

  for(var d=1;d<=daysInMonth;d++){
    var dateStr = '2026-06-'+String(d).padStart(2,'0');
    var day = allDays.find(function(dy){return dy.date===dateStr;});
    var cell = document.createElement('div');
    cell.className = 'cal-cell'+(day?' has-day':'');

    var dateDiv = document.createElement('div');
    dateDiv.className = 'cal-date';
    dateDiv.textContent = d;
    cell.appendChild(dateDiv);

    if(day){
      var dayItems = allItems.filter(function(i){return i.day_id===day.id;});
      dayItems.slice(0,3).forEach(function(item){
        var chip = document.createElement('div');
        chip.className = 'cal-chip';
        chip.style.borderLeftColor = CAT_COLORS[item.category]||'#6b7280';
        chip.textContent = item.activity;
        cell.appendChild(chip);
      });
      if(dayItems.length>3){
        var more = document.createElement('div');
        more.className = 'cal-more';
        more.textContent = '+'+(dayItems.length-3)+' more';
        cell.appendChild(more);
      }
      (function(d2){ cell.onclick = function(){ openModal(d2); }; })(day);
    }
    grid.appendChild(cell);
  }

  monthEl.appendChild(grid);
  container.appendChild(monthEl);
}

function openModal(day){
  var items = allItems.filter(function(i){return i.day_id===day.id;})
    .sort(function(a,b){return (a.sort_order||0)-(b.sort_order||0);});
  var body = document.getElementById('modal-body');
  body.innerHTML =
    '<div class="modal-date">'+fmtDate(day.date)+'</div>'+
    '<div class="modal-title">'+(day.title||'Day '+day.day_number)+'</div>';
  if(!items.length){
    body.innerHTML += '<div style="color:var(--text-muted);font-size:14px;padding:20px 0;text-align:center;">Nothing planned yet 🌿</div>';
  } else {
    items.forEach(function(item){
      var a = document.createElement('div');
      a.className = 'act-item';
      a.innerHTML =
        '<div class="act-dot" style="background:'+(CAT_COLORS[item.category]||'#6b7280')+'"></div>'+
        '<div class="act-info">'+
          '<div class="act-name">'+item.activity+'</div>'+
          '<div class="act-meta">'+
            (item.time?'<span>⏰ '+item.time+'</span>':'')+
            (item.location?'<span>📍 '+item.location+'</span>':'')+
            (item.notes?'<span>'+item.notes+'</span>':'')+
            '<span class="act-chip">'+(CAT_LABELS[item.category]||item.category||'')+'</span>'+
          '</div>'+
        '</div>'+
        (item.cost?'<div class="act-cost">'+fmtMoney(item.cost)+'</div>':'');
      body.appendChild(a);
    });
  }
  document.getElementById('modal').classList.remove('hidden');
}

function closeModal(){
  document.getElementById('modal').classList.add('hidden');
}

loadData();
</script>
</body>
</html>
