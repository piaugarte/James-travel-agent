
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vancouver 2026 🍁</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --green:#1a4731;--green-light:#2d6a4f;--green-pale:#f0f7f4;
    --amber:#e76f00;--amber-pale:#fff8f0;
    --red:#c62828;--purple:#5e35b1;--blue:#1565c0;--gray:#6b7280;
    --white:#fff;--bg:#f8f7f4;--border:#e5e7eb;
    --text:#1a1a1a;--text-muted:#6b7280;
    --radius:14px;--shadow:0 2px 12px rgba(0,0,0,0.07);--shadow-lg:0 8px 32px rgba(0,0,0,0.12);
  }
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  /* HERO */
  .hero{
    background:linear-gradient(135deg,#1a4731 0%,#2d6a4f 50%,#1a4731 100%);
    padding:48px 20px 36px;text-align:center;position:relative;overflow:hidden;
  }
  .hero::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");}
  .hero-emoji{font-size:48px;margin-bottom:12px;display:block;}
  .hero-title{font-family:'Playfair Display',serif;font-size:clamp(32px,6vw,56px);font-weight:900;color:white;line-height:1.1;margin-bottom:8px;}
  .hero-sub{color:rgba(255,255,255,0.75);font-size:16px;margin-bottom:24px;}
  .hero-stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .hero-stat{background:rgba(255,255,255,0.12);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);border-radius:10px;padding:10px 18px;color:white;text-align:center;}
  .hero-stat .val{font-size:20px;font-weight:700;display:block;}
  .hero-stat .lbl{font-size:11px;opacity:0.7;text-transform:uppercase;letter-spacing:.05em;}

  /* NAV */
  .nav{background:white;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:var(--shadow);}
  .nav-inner{display:flex;max-width:900px;margin:0 auto;padding:0 16px;}
  .nav-btn{flex:1;padding:14px 8px;border:none;background:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;}
  .nav-btn.active{color:var(--green);border-bottom-color:var(--green);}
  .nav-btn:hover{color:var(--green);}

  /* MAIN */
  main{max-width:900px;margin:0 auto;padding:20px 16px 80px;}

  /* TABS */
  .tab{display:none;}.tab.active{display:block;}

  /* PHASE HEADERS */
  .phase-header{display:flex;align-items:center;gap:10px;padding:16px 0 8px;margin-top:8px;}
  .phase-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .phase-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--text);}
  .phase-dates{font-size:12px;color:var(--text-muted);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:3px 10px;}

  /* DAY CARDS */
  .day-card{background:white;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .2s;}
  .day-card:hover{box-shadow:var(--shadow-lg);}
  .day-header{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;}
  .day-num{width:36px;height:36px;border-radius:10px;background:var(--green);color:white;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .day-info{flex:1;}
  .day-title{font-weight:700;font-size:15px;}
  .day-date{font-size:12px;color:var(--text-muted);}
  .day-cost{font-size:13px;font-weight:600;color:var(--green-light);}
  .day-chevron{font-size:12px;color:var(--text-muted);transition:transform .2s;}
  .day-chevron.open{transform:rotate(180deg);}
  .day-items{padding:0 16px 12px;border-top:1px solid var(--border);}
  .day-empty{padding:12px 0;font-size:13px;color:var(--text-muted);font-style:italic;}

  /* ACTIVITY ITEMS */
  .act-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f3f4f6;}
  .act-item:last-child{border-bottom:none;}
  .act-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;}
  .act-info{flex:1;min-width:0;}
  .act-name{font-size:14px;font-weight:600;color:var(--text);}
  .act-meta{font-size:11px;color:var(--text-muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;}
  .act-cost{font-size:13px;font-weight:600;color:var(--green-light);flex-shrink:0;}
  .act-chip{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:10px;}

  /* CALENDAR */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:16px;}
  .cal-dow{text-align:center;font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;padding:6px 0;}
  .cal-cell{min-height:80px;background:white;border:1px solid var(--border);border-radius:8px;padding:4px;cursor:pointer;transition:all .15s;}
  .cal-cell:hover{box-shadow:var(--shadow);border-color:var(--green-light);}
  .cal-cell.today{border-color:var(--amber);border-width:2px;}
  .cal-cell.empty{background:transparent;border-color:transparent;cursor:default;}
  .cal-cell.active{border-color:var(--green);background:var(--green-pale);}
  .cal-date{font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:3px;}
  .cal-cell.active .cal-date{color:var(--green);}
  .cal-chip{font-size:9px;background:white;border:1px solid var(--border);border-left:2px solid;border-radius:3px;padding:1px 4px;margin-bottom:1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.4;}
  .cal-more{font-size:9px;color:var(--text-muted);padding:1px 2px;}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:0;}
  .modal-overlay.hidden{display:none;}
  .modal{background:white;border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:85vh;overflow-y:auto;padding:24px;}
  .modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px;}
  .modal-date{font-size:13px;color:var(--text-muted);margin-bottom:4px;}
  .modal-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;margin-bottom:16px;}

  /* LEGEND */
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);}
  .legend-dot{width:8px;height:8px;border-radius:50%;}

  /* LOADING */
  .loading{text-align:center;padding:60px 20px;color:var(--text-muted);}
  .loading-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .fade-in{animation:fadeIn .3s ease forwards;}

  /* PHASE COLORS */
  .phase-surrey .day-num{background:#1a4731;}
  .phase-whistler .day-num{background:#5e35b1;}
  .phase-final .day-num{background:#c62828;}

  @media(max-width:500px){
    .hero{padding:32px 16px 24px;}
    .cal-cell{min-height:60px;}
    .cal-chip{display:none;}
    .cal-cell.active::after{content:'•';display:block;text-align:center;color:var(--green);font-size:14px;}
  }
</style>
</head>
<body>

<div class="hero">
  <span class="hero-emoji">🍁</span>
  <h1 class="hero-title">Vancouver 2026</h1>
  <p class="hero-sub">Garcia-Morera Family Trip · June 15 – July 1</p>
  <div class="hero-stats">
    <div class="hero-stat"><span class="val">17</span><span class="lbl">Days</span></div>
    <div class="hero-stat"><span class="val">12</span><span class="lbl">People</span></div>
    <div class="hero-stat"><span class="val" id="stat-activities">—</span><span class="lbl">Activities</span></div>

  </div>
</div>

<nav class="nav">
  <div class="nav-inner">
    <button class="nav-btn active" onclick="showTab('list',this)">📋 Itinerary</button>
    <button class="nav-btn" onclick="showTab('calendar',this)">📅 Calendar</button>
  </div>
</nav>

<main>
  <!-- LIST TAB -->
  <div id="tab-list" class="tab active">
    <div id="list-container"><div class="loading"><div class="loading-spinner"></div>Loading your trip...</div></div>
  </div>

  <!-- CALENDAR TAB -->
  <div id="tab-calendar" class="tab">
    <div class="legend" id="cal-legend">
      <div class="legend-item"><div class="legend-dot" style="background:#1a4731"></div>Surrey</div>
      <div class="legend-item"><div class="legend-dot" style="background:#5e35b1"></div>Whistler</div>
      <div class="legend-item"><div class="legend-dot" style="background:#c62828"></div>Final Days</div>
    </div>
    <div id="cal-container"><div class="loading"><div class="loading-spinner"></div>Loading calendar...</div></div>
  </div>
</main>

<!-- DAY MODAL -->
<div class="modal-overlay hidden" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modal-content">
    <div class="modal-handle"></div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://ajtjpcenmlzmpnzrfxvg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqdGpwY2VubWx6bXBuenJmeHZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2ODM5ODIsImV4cCI6MjA5MTI1OTk4Mn0.JoLMU5T6LJiCAQ_xLzEHmGI7CPACeeDMQjt_tfNSO5k';
const TRIP_ID = 'a1b2c3d4-0000-0000-0000-000000000001';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CAT_COLORS = {flight:'#c62828',accommodation:'#5e35b1',food:'#e76f00',activity:'#2d6a4f',transport:'#1565c0',other:'#6b7280',hotel:'#5e35b1'};
const CAT_LABELS = {flight:'Flights',accommodation:'Accommodation',food:'Food',activity:'Activity',transport:'Transport',other:'Misc',hotel:'Accommodation'};

let allDays = [], allItems = [], tripData = null;

function getPhase(date){
  if(!date) return 'surrey';
  if(date <= '2026-06-24') return 'surrey';
  if(date <= '2026-06-28') return 'whistler';
  return 'final';
}
function getPhaseColor(phase){ return {surrey:'#1a4731',whistler:'#5e35b1',final:'#c62828'}[phase]||'#1a4731'; }
function getPhaseLabel(phase){ return {surrey:'Surrey Base',whistler:'Whistler',final:'Final Days'}[phase]||''; }

function fmtDate(d){
  if(!d) return '';
  var dt = new Date(d+'T12:00:00');
  return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function fmtMoney(n){ return 'US$'+(Math.round(Number(n)||0)).toLocaleString(); }

async function loadData(){
  var [trip, days, items] = await Promise.all([
    sb.from('trip').select('*').eq('id',TRIP_ID).single(),
    sb.from('itinerary_days').select('*').eq('trip_id',TRIP_ID).order('day_number'),
    sb.from('itinerary_items').select('*').not('day_id','is',null).order('sort_order')
  ]);
  tripData = trip.data;
  allDays = days.data||[];
  allItems = items.data||[];

  // update stats
  document.getElementById('stat-activities').textContent = allItems.length;


  renderList();
  renderCalendar();
}

function showTab(name, btn){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
}

// ── LIST VIEW ──
function renderList(){
  var container = document.getElementById('list-container');
  container.innerHTML = '';
  if(!allDays.length){
    container.innerHTML = '<div class="loading">No days yet 📅</div>';
    return;
  }

  // group by phase
  var phases = ['surrey','whistler','final'];
  var phaseLabels = {surrey:'🏡 Surrey Base',whistler:'🏔️ Whistler',final:'🎂 Final Days'};
  var phaseDates = {surrey:'Jun 15 – 24',whistler:'Jun 25 – 28',final:'Jun 29 – Jul 1'};

  phases.forEach(function(phase){
    var days = allDays.filter(function(d){ return getPhase(d.date)===phase; });
    if(!days.length) return;

    var phaseEl = document.createElement('div');
    phaseEl.style.cssText = 'margin-bottom:8px;';

    var phHdr = document.createElement('div');
    phHdr.className = 'phase-header';
    phHdr.innerHTML = '<div class="phase-dot" style="background:'+getPhaseColor(phase)+'"></div>'+
      '<span class="phase-title">'+phaseLabels[phase]+'</span>'+
      '<span class="phase-dates">'+phaseDates[phase]+'</span>';
    phaseEl.appendChild(phHdr);

    days.forEach(function(day){
      var items = allItems.filter(function(i){return i.day_id===day.id;}).sort(function(a,b){return (a.sort_order||0)-(b.sort_order||0);});
      var dayTotal = items.reduce(function(s,i){return s+(Number(i.cost)||0);},0);

      var card = document.createElement('div');
      card.className = 'day-card fade-in phase-'+phase;

      var hdr = document.createElement('div');
      hdr.className = 'day-header';
      hdr.innerHTML = '<div class="day-num" style="background:'+getPhaseColor(phase)+'">'+day.day_number+'</div>'+
        '<div class="day-info"><div class="day-title">'+(day.title||'Day '+day.day_number)+'</div>'+
        '<div class="day-date">'+fmtDate(day.date)+'</div></div>'+
        (dayTotal?'<div class="day-cost">'+fmtMoney(dayTotal)+'</div>':'')+
        '<div class="day-chevron" id="chev-'+day.id+'">▼</div>';

      var body = document.createElement('div');
      body.className = 'day-items';
      body.id = 'day-body-'+day.id;
      body.style.display = 'none';

      if(!items.length){
        body.innerHTML = '<div class="day-empty">Nothing planned yet</div>';
      } else {
        items.forEach(function(item){
          var act = document.createElement('div');
          act.className = 'act-item';
          act.innerHTML = '<div class="act-dot" style="background:'+(CAT_COLORS[item.category]||'#6b7280')+'"></div>'+
            '<div class="act-info">'+
              '<div class="act-name">'+item.activity+'</div>'+
              '<div class="act-meta">'+
                (item.time?'<span>'+item.time+'</span>':'')+
                (item.location?'<span>📍 '+item.location+'</span>':'')+
                '<span class="act-chip">'+(CAT_LABELS[item.category]||item.category||'')+'</span>'+
              '</div>'+
            '</div>'+
            (item.cost?'<div class="act-cost">'+fmtMoney(item.cost)+'</div>':'');
          body.appendChild(act);
        });
      }

      hdr.onclick = function(){
        var isOpen = body.style.display !== 'none';
        body.style.display = isOpen ? 'none' : 'block';
        document.getElementById('chev-'+day.id).className = 'day-chevron'+(isOpen?'':' open');
      };

      card.appendChild(hdr);
      card.appendChild(body);
      phaseEl.appendChild(card);
    });

    container.appendChild(phaseEl);
  });
}

// ── CALENDAR VIEW ──
function renderCalendar(){
  var container = document.getElementById('cal-container');
  container.innerHTML = '';

  // June + July
  [{year:2026,month:5,label:'June 2026'},{year:2026,month:6,label:'July 2026'}].forEach(function(m){
    var monthEl = document.createElement('div');
    monthEl.style.cssText = 'margin-bottom:24px;';
    var mHdr = document.createElement('div');
    mHdr.style.cssText = 'font-family:Playfair Display,serif;font-size:20px;font-weight:700;margin-bottom:12px;color:var(--text);';
    mHdr.textContent = m.label;
    monthEl.appendChild(mHdr);

    var grid = document.createElement('div');
    grid.className = 'cal-grid';

    // day of week headers
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(function(d){
      var dow = document.createElement('div');
      dow.className = 'cal-dow';
      dow.textContent = d;
      grid.appendChild(dow);
    });

    var firstDay = new Date(m.year, m.month, 1).getDay();
    var daysInMonth = new Date(m.year, m.month+1, 0).getDate();

    // empty cells
    for(var i=0;i<firstDay;i++){
      var empty = document.createElement('div');
      empty.className = 'cal-cell empty';
      grid.appendChild(empty);
    }

    for(var d=1;d<=daysInMonth;d++){
      var dateStr = m.year+'-'+String(m.month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var day = allDays.find(function(dy){return dy.date===dateStr;});
      var cell = document.createElement('div');
      cell.className = 'cal-cell'+(day?' active':'');

      var phase = getPhase(dateStr);
      var phaseColor = getPhaseColor(phase);

      var dateDiv = document.createElement('div');
      dateDiv.className = 'cal-date';
      dateDiv.style.color = day ? phaseColor : '';
      dateDiv.textContent = d;
      cell.appendChild(dateDiv);

      if(day){
        var dayItems = allItems.filter(function(i){return i.day_id===day.id;}).slice(0,3);
        dayItems.forEach(function(item){
          var chip = document.createElement('div');
          chip.className = 'cal-chip';
          chip.style.borderLeftColor = CAT_COLORS[item.category]||'#6b7280';
          chip.textContent = item.activity;
          cell.appendChild(chip);
        });
        var remaining = allItems.filter(function(i){return i.day_id===day.id;}).length - 3;
        if(remaining>0){
          var more = document.createElement('div');
          more.className = 'cal-more';
          more.textContent = '+'+remaining+' more';
          cell.appendChild(more);
        }
        cell.onclick = function(d2, day2){ return function(){ openDayModal(day2); }; }(d, day);
        cell.style.borderTopColor = phaseColor;
        cell.style.borderTopWidth = '3px';
      }
      grid.appendChild(cell);
    }
    monthEl.appendChild(grid);
    container.appendChild(monthEl);
  });
}

function openDayModal(day){
  var items = allItems.filter(function(i){return i.day_id===day.id;}).sort(function(a,b){return (a.sort_order||0)-(b.sort_order||0);});
  var phase = getPhase(day.date);
  var phaseColor = getPhaseColor(phase);
  var body = document.getElementById('modal-body');
  body.innerHTML = '<div class="modal-date">'+fmtDate(day.date)+'</div>'+
    '<div class="modal-title" style="color:'+phaseColor+'">'+(day.title||'Day '+day.day_number)+'</div>';

  if(!items.length){
    body.innerHTML += '<div style="color:var(--text-muted);font-size:14px;padding:20px 0;text-align:center;">Nothing planned yet 🌿</div>';
  } else {
    items.forEach(function(item){
      var act = document.createElement('div');
      act.className = 'act-item';
      act.innerHTML = '<div class="act-dot" style="background:'+(CAT_COLORS[item.category]||'#6b7280')+'"></div>'+
        '<div class="act-info">'+
          '<div class="act-name">'+item.activity+'</div>'+
          '<div class="act-meta">'+
            (item.time?'<span>⏰ '+item.time+'</span>':'')+
            (item.location?'<span>📍 '+item.location+'</span>':'')+
            (item.notes?'<span>'+item.notes+'</span>':'')+
            '<span class="act-chip">'+(CAT_LABELS[item.category]||item.category||'')+'</span>'+
          '</div>'+
        '</div>'+
        (item.cost?'<div class="act-cost">'+fmtMoney(item.cost)+'</div>':'');
      body.appendChild(act);
    });
  }
  document.getElementById('modal').classList.remove('hidden');
}

function closeModal(e){
  if(e.target === document.getElementById('modal')) document.getElementById('modal').classList.add('hidden');
}

loadData();
</script>
</body>
</html>
